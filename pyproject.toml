[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polylinguist"
version = "0.1.0"
description = "Local AI subtitle translator sidecar for Stremio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "packaging>=24.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
models = [
    "argostranslate>=1.9.6",
    "huggingface-hub>=0.30.0",
    "pillow>=10.0.0",
    "sentencepiece>=0.2.0",
    "transformers>=4.51.0",
    "torch>=2.7",
]
windows-gpu = [
    "onnx>=1.17.0",
    "onnxruntime-directml>=1.20.0",
    "optimum-intel[openvino]>=1.25.1,<1.26",
]
system = [
    "psutil>=6.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
polylinguist = "polylinguist.main:main"
polylinguist-uninstall = "polylinguist.uninstall:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
polylinguist = ["py.typed"]
